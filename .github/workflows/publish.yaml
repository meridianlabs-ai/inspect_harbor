name: Publish Package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm publishing to PyPI'
        required: true
        type: string

permissions: {}

jobs:
  # The build runs in the shared workflow, in a job with no publishing
  # credential. The build frontend and backend come from
  # scripts/build-dist/requirements.txt, pinned with hashes, and Dependabot
  # updates the file. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.12 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@b6f97e6b72216233d805ce570ceb7fa2071f8a93 # main
    with:
      python-version: "3.12"

  publish:
    needs: build
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-harbor
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
