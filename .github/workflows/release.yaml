name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@v1
    with:
      approvers: "alexandraabbas jjallaire dragonstyle"
    secrets: inherit

  # Publish stays in-repo (PyPI trusted publishing can't run from a cross-repo
  # reusable workflow; keeping it here leaves the trusted-publisher config for
  # workflow release.yaml unchanged).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Display version
        run: |
          echo "Version: $(git describe --tags --always)"
      - name: Install dependencies
        run: |
          pip install --upgrade pip build
      - name: Build package
        run: |
          python -m build
      - name: List built packages
        run: ls -lh dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
