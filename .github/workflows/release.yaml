name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
    with:
      approvers: "alexandraabbas jjallaire dragonstyle"
    secrets: inherit

  # The build toolchain pinned with hashes; publish.yaml gives the command
  # that updates it. The build runs in the shared workflow, in a job with no
  # publishing credential. It waits for release-please, so hatch-vcs builds
  # the tagged version.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@378070a4dd5c735a790016981ee144e71ed0b3f3 # main
    with:
      python-version: "3.12"

  # Publish stays in-repo (PyPI trusted publishing can't run from a cross-repo
  # reusable workflow; keeping it here leaves the trusted-publisher config for
  # workflow release.yaml unchanged).
  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-harbor
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
