name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
    with:
      approvers: "alexandraabbas jjallaire dragonstyle"
    secrets: inherit

  # The build runs in the shared workflow, in a job with no publishing
  # credential. It waits for release-please, so hatch-vcs builds the tagged
  # version. The build frontend and backend come from
  # scripts/build-dist/requirements.txt, pinned with hashes, and Dependabot
  # updates the file. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.12 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
    with:
      python-version: "3.12"

  # Publish stays in-repo (PyPI trusted publishing can't run from a cross-repo
  # reusable workflow; keeping it here leaves the trusted-publisher config for
  # workflow release.yaml unchanged).
  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-harbor
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
