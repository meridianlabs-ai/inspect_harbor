name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only for every job that runs code from the checkout: an agent may land
# build and dependency configuration (pyproject.toml, uv.lock; the tier-2
# opt-in, meridianlabs-ai/agents design/executed-paths-residual.md), and these
# jobs run it. The coverage writes happen where nothing from the checkout
# runs: the PR comment from coverage-comment.yml (workflow_run), the data
# branch from the `coverage` job below (git only).
permissions:
  contents: read

jobs:
  py-lint:
    runs-on: ubuntu-latest
    # Pins uv to the matrix interpreter rather than whichever one it finds first.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Format with Ruff
        run: uv run ruff format --check .

  validate-overrides:
    # Blocks PRs whose committed docs/overrides.yml is broken: empty/invalid
    # categories or a bad function_name. Upstream registry drift (a new hub
    # slug not yet stubbed) is a non-fatal warning so it can't block unrelated
    # PRs; the nightly cron stubs new datasets, and the empty-categories gate
    # then catches them on the nightly triage PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Validate docs/overrides.yml
        run: uv run python scripts/validate_overrides.py

  py-type:
    runs-on: ubuntu-latest
    # Pins uv to the matrix interpreter rather than whichever one it finds first.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Type check with pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the coverage action reads the PR diff
    # Pins uv to the matrix interpreter rather than whichever one it finds first.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Run tests with coverage
        run: uv run pytest --cov=inspect_harbor --cov-report=term --cov-report=xml --cov-branch
      # Main's coverage data branch is computed here too, read-only, by the
      # action's push mode: its `git push` goes to a local bare repository,
      # and the commit it made is handed to the `coverage` job as a git
      # bundle. Coverage reporting (the project's coverage config and plugins)
      # runs only in this job.
      - name: Send the coverage data push to a local repository
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git init -q --bare .coverage-data.git
          git remote set-url --push origin ./.coverage-data.git
      # On a pull request, the action cannot post with the read-only token,
      # so it writes the comment to a file, which coverage-comment.yml posts
      # (the action's documented two-workflow split).
      - name: Coverage comment
        id: coverage_comment
        if: >-
          matrix.python-version == '3.12' && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_DATA_BRANCH: python-coverage-comment-action-data
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90
      - name: Store the coverage comment
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # coverage-comment.yml's action reads these default names.
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Bundle the coverage data commit
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BRANCH: python-coverage-comment-action-data
          OUT: ${{ runner.temp }}/coverage-data
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          # The branch's tip on GitHub, which the action fetched and built on.
          old=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          new=$(git rev-parse -q --verify "refs/heads/$BRANCH" || true)
          if [ -z "$new" ] || [ "$new" = "$old" ]; then
            echo unchanged > "$OUT/status"
          else
            git bundle create "$OUT/data.bundle" "refs/heads/$BRANCH" ${old:+"^$old"}
            echo changed > "$OUT/status"
          fi
      - name: Store the coverage data commit
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: ${{ runner.temp }}/coverage-data
          if-no-files-found: error

  # Pushes the coverage data commit py-test made to the action's data branch.
  # Nothing from the branch is checked out or run: git only reads the bundle
  # into a bare repository and pushes it, fast-forward only.
  coverage:
    needs: py-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage-data
      - name: Push the coverage data branch
        env:
          BRANCH: python-coverage-comment-action-data
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(cat coverage-data/status)" != changed ]; then
            echo "The coverage data did not change."
            exit 0
          fi
          git init -q --bare data.git
          cd data.git
          if git ls-remote --exit-code "$ORIGIN" "refs/heads/$BRANCH" > /dev/null; then
            # The bundle's prerequisite: the tip py-test built on.
            git fetch -q "$ORIGIN" "refs/heads/$BRANCH"
          fi
          git bundle verify -q ../coverage-data/data.bundle
          git fetch -q ../coverage-data/data.bundle "refs/heads/$BRANCH:refs/coverage-data"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push "$ORIGIN" "refs/coverage-data:refs/heads/$BRANCH"

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install build dependencies
        run: uv pip install --system build
      - name: Build package
        run: python -m build
      - name: Verify package
        run: |
          uv pip install --system dist/*.whl
          python -c "import inspect_harbor; print('Package imported successfully')"
