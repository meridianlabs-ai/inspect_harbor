name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only for every job that runs code from the checkout: an agent may land
# build and dependency configuration (pyproject.toml, uv.lock; the tier-2
# opt-in, meridianlabs-ai/agents design/executed-paths-residual.md), and these
# jobs run it. The coverage writes happen where no checkout code runs: the PR
# comment from coverage-comment.yml (workflow_run), the data branch from the
# `coverage` job below.
permissions:
  contents: read

jobs:
  py-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        # --no-group doc: quarto-cli has no wheel and its sdist downloads the
        # Quarto binary from GitHub Releases at build time, a flaky ~100 MB
        # fetch none of these jobs need (only the docs publish uses Quarto).
        run: uv sync --no-group doc
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Format with Ruff
        run: uv run ruff format --check .

  validate-overrides:
    # Blocks PRs whose committed docs/overrides.yml is broken: empty/invalid
    # categories or a bad function_name. Upstream registry drift (a new hub
    # slug not yet stubbed) is a non-fatal warning so it can't block unrelated
    # PRs; the nightly cron stubs new datasets, and the empty-categories gate
    # then catches them on the nightly triage PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        # --no-group doc: quarto-cli has no wheel and its sdist downloads the
        # Quarto binary from GitHub Releases at build time, a flaky ~100 MB
        # fetch none of these jobs need (only the docs publish uses Quarto).
        run: uv sync --no-group doc
      - name: Validate docs/overrides.yml
        run: uv run python scripts/validate_overrides.py

  py-type:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        # --no-group doc: quarto-cli has no wheel and its sdist downloads the
        # Quarto binary from GitHub Releases at build time, a flaky ~100 MB
        # fetch none of these jobs need (only the docs publish uses Quarto).
        run: uv sync --no-group doc
      - name: Type check with pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the coverage action reads the PR diff
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        # --no-group doc: quarto-cli has no wheel and its sdist downloads the
        # Quarto binary from GitHub Releases at build time, a flaky ~100 MB
        # fetch none of these jobs need (only the docs publish uses Quarto).
        run: uv sync --no-group doc
      - name: Run tests with coverage
        run: uv run pytest --cov=inspect_harbor --cov-report=term --cov-report=xml --cov-branch
      # The action's PR mode with a read-only token: it cannot post, so it
      # writes the comment to a file, which coverage-comment.yml posts (the
      # action's documented two-workflow split).
      - name: Coverage comment
        id: coverage_comment
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90
      - name: Store the coverage comment
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          # coverage-comment.yml's action reads these default names.
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Store the coverage data
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  # Main's coverage data, on the action's data branch. Runs nothing from the
  # checkout: the action's own container reads the .coverage file py-test
  # stored and the source it covers. v3 pushes with the credentials
  # actions/checkout persists (v4.1 and later take the token instead).
  coverage:
    needs: py-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: coverage-data
      - name: Coverage data
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install build dependencies
        run: uv pip install --system build
      - name: Build package
        run: python -m build
      - name: Verify package
        run: |
          uv pip install --system dist/*.whl
          python -c "import inspect_harbor; print('Package imported successfully')"
